<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <p>The task lists and unit test results below are written by update_index.sh on every CI run.</p>

  <h2>ToDo Tasks</h2>
  <pre id="pending">
Not updated yet
</pre>

  <h2>Done Tasks</h2>
  <pre id="completed">
Not updated yet
</pre>

  <h2>Unit Test Results</h2>
  <pre id="unittest">
Not updated yet
</pre>
</body>
</html>
